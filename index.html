<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K9K Slots Premium - Smooth Roll</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0a0f linear-gradient(135deg, #0d0d1a 0%, #050508 100%);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .slot-container {
      background: #14141f;
      border: 3px solid #d4af37;
      border-radius: 20px;
      padding: 20px;
      width: 95%;
      max-width: 900px;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
      text-align: center;
      position: relative;
    }

    /* Topo: Jackpots */
    .jackpot-header {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .jackpot-card {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      padding: 8px;
      border: 1px solid #d4af37;
    }

    .jackpot-card.grand { border-color: #ff3333; }
    .jackpot-card.major { border-color: #a833ff; }
    .jackpot-card.minor { border-color: #3385ff; }
    .jackpot-card.mini { border-color: #33ff77; }

    .jackpot-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .jackpot-value {
      font-size: 14px;
      font-weight: bold;
      color: #ffcc00;
    }

    /* Grelha de Slots (5 colunas x 3 linhas) */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      background: #000;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #333;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
      margin-bottom: 15px;
      position: relative;
    }

    .reel-window {
      height: 290px; /* 3 símbolos de 90px + lacunas */
      background: #11111a;
      border-radius: 8px;
      border: 1px solid #222;
      overflow: hidden;
      position: relative;
    }

    .reel-strip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 5px;
      will-change: transform;
    }

    .slot-cell {
      height: 80px;
      min-height: 80px;
      background: radial-gradient(circle, #222233 0%, #11111a 100%);
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      user-select: none;
    }

    .slot-cell.win-highlight {
      animation: pulseWin 0.6s infinite alternate;
      border: 2px solid #ffcc00;
      background: radial-gradient(circle, #443311 0%, #221100 100%);
    }

    @keyframes pulseWin {
      0% { transform: scale(0.95); box-shadow: 0 0 10px #ffcc00; }
      100% { transform: scale(1.05); box-shadow: 0 0 25px #ffcc00; }
    }

    /* Painel de Controle */
    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0a12;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid #2a2a3a;
      gap: 15px;
      flex-wrap: wrap;
    }

    .stat-box {
      text-align: left;
    }

    .stat-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }

    .bet-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-bet {
      background: #222233;
      color: #fff;
      border: 1px solid #444;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    .btn-spin {
      background: linear-gradient(180deg, #ffcc00 0%, #cc9900 100%);
      color: #000;
      border: none;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
      transition: transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-spin:active {
      transform: scale(0.92);
    }

    .btn-spin:disabled {
      background: #444;
      color: #888;
      box-shadow: none;
      cursor: not-allowed;
    }

    .message-bar {
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #ffcc00;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="slot-container">
    <!-- Jackpots Superior -->
    <div class="jackpot-header">
      <div class="jackpot-card grand">
        <div class="jackpot-title" style="color: #ff3333;">Grand</div>
        <div class="jackpot-value">R$ 50.000,00</div>
      </div>
      <div class="jackpot-card major">
        <div class="jackpot-title" style="color: #a833ff;">Major</div>
        <div class="jackpot-value">R$ 10.000,00</div>
      </div>
      <div class="jackpot-card minor">
        <div class="jackpot-title" style="color: #3385ff;">Minor</div>
        <div class="jackpot-value">R$ 2.000,00</div>
      </div>
      <div class="jackpot-card mini">
        <div class="jackpot-title" style="color: #33ff77;">Mini</div>
        <div class="jackpot-value">R$ 500,00</div>
      </div>
    </div>

    <!-- Matriz 5x3 com Rolagem Vertical -->
    <div class="reels-grid">
      <div class="reel-window"><div class="reel-strip" id="strip0"></div></div>
      <div class="reel-window"><div class="reel-strip" id="strip1"></div></div>
      <div class="reel-window"><div class="reel-strip" id="strip2"></div></div>
      <div class="reel-window"><div class="reel-strip" id="strip3"></div></div>
      <div class="reel-window"><div class="reel-strip" id="strip4"></div></div>
    </div>

    <!-- Mensagem -->
    <div class="message-bar" id="message">Clique em Girar para jogar!</div>

    <!-- Painel -->
    <div class="control-panel">
      <div class="stat-box">
        <div class="stat-label">Saldo</div>
        <div class="stat-value" id="balanceDisplay">R$ 1.250,00</div>
      </div>

      <div class="bet-controls">
        <button class="btn-bet" onclick="changeBet(-1)">-</button>
        <div class="stat-box" style="text-align: center;">
          <div class="stat-label">Aposta Total</div>
          <div class="stat-value" id="betDisplay">R$ 5,00</div>
        </div>
        <button class="btn-bet" onclick="changeBet(1)">+</button>
      </div>

      <button class="btn-spin" id="spinBtn" onclick="spin()">↻</button>
    </div>
  </div>

  <script>
    const SYMBOLS = [
      { char: '🍒', name: 'Cereja', pay: 2 },
      { char: '🍋', name: 'Limão', pay: 2 },
      { char: '🍊', name: 'Laranja', pay: 3 },
      { char: '🍇', name: 'Uva', pay: 3 },
      { char: '🍉', name: 'Melancia', pay: 4 },
      { char: '🔔', name: 'Sino', pay: 5 },
      { char: '🏷️', name: 'BAR', pay: 8 },
      { char: '💎', name: 'Diamante', pay: 10 },
      { char: '7️⃣', name: 'Sete', pay: 15 },
      { char: '👑', name: 'WILD', pay: 25 }
    ];

    let balance = 1250.00;
    let bet = 5.00;
    const betSteps = [1, 2, 5, 10, 20, 50];
    let betIndex = 2;
    let isSpinning = false;

    // As 3 Linhas pedidas:
    // Linha 1: ➡️ (Do meio)
    // Linha 2: ↘️ (Diagonal topo -> base)
    // Linha 3: ↗️ (Diagonal base -> topo)
    const paylines = [
      { name: "Linha do Meio ➡️", coords: [[0,1], [1,1], [2,1], [3,1], [4,1]] },
      { name: "Diagonal Descendente ↘️", coords: [[0,0], [1,1], [2,2], [3,2], [4,2]] },
      { name: "Diagonal Ascendente ↗️", coords: [[0,2], [1,1], [2,0], [3,0], [4,0]] }
    ];

    function getRandomSymbol() {
      return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    }

    // Inicializa a roleta com uma fita bem longa de símbolos para rolagem
    function initReels() {
      for (let col = 0; col < 5; col++) {
        const strip = document.getElementById(`strip${col}`);
        strip.innerHTML = '';
        // Geramos 20 símbolos em cada fita para permitir o efeito de descida rápida
        for (let i = 0; i < 20; i++) {
          const cell = document.createElement('div');
          cell.className = 'slot-cell';
          cell.textContent = getRandomSymbol().char;
          strip.appendChild(cell);
        }
        strip.style.transform = 'translateY(0px)';
      }
    }

    function updateDisplay() {
      document.getElementById('balanceDisplay').textContent = `R$ ${balance.toFixed(2)}`;
      document.getElementById('betDisplay').textContent = `R$ ${bet.toFixed(2)}`;
    }

    function changeBet(direction) {
      if (isSpinning) return;
      betIndex += direction;
      if (betIndex < 0) betIndex = 0;
      if (betIndex >= betSteps.length) betIndex = betSteps.length - 1;
      bet = betSteps[betIndex];
      updateDisplay();
    }

    function clearHighlights() {
      document.querySelectorAll('.slot-cell').forEach(cell => {
        cell.classList.remove('win-highlight');
      });
    }

    function spin() {
      if (isSpinning) return;
      if (balance < bet) {
        document.getElementById('message').textContent = "Saldo insuficiente!";
        return;
      }

      clearHighlights();
      balance -= bet;
      updateDisplay();
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('message').textContent = "Girando...";

      const finalMatrix = [[], [], [], [], []];
      let finishedCols = 0;

      for (let col = 0; col < 5; col++) {
        const strip = document.getElementById(`strip${col}`);
        
        // Símbolos finais para esta coluna
        const res0 = getRandomSymbol();
        const res1 = getRandomSymbol();
        const res2 = getRandomSymbol();
        finalMatrix[col] = [res0, res1, res2];

        // Atualiza o TOPO da fita com os resultados finais
        const cells = strip.querySelectorAll('.slot-cell');
        cells[0].textContent = res0.char;
        cells[1].textContent = res1.char;
        cells[2].textContent = res2.char;

        // Preenche o restante com símbolos aleatórios para o efeito visual de descida
        for(let k = 3; k < cells.length; k++) {
          cells[k].textContent = getRandomSymbol().char;
        }

        // Posiciona a fita no final (embaixo) sem transição
        strip.style.transition = 'none';
        strip.style.transform = `translateY(-1530px)`; // (17 células * 90px)

        // Força renderização do navegador
        strip.offsetHeight;

        // Aplica a animação de deslizar suavemente para CIMA -> BAIXO (posição 0)
        const duration = 1.2 + (col * 0.3); // Delay em cascata para cada coluna
        strip.style.transition = `transform ${duration}s cubic-bezier(0.1, 0.9, 0.2, 1.0)`;
        strip.style.transform = 'translateY(0px)';

        setTimeout(() => {
          finishedCols++;
          if (finishedCols === 5) {
            checkWinnings(finalMatrix);
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
          }
        }, duration * 1000);
      }
    }

    function checkWinnings(matrix) {
      let totalWin = 0;
      let winMessages = [];

      paylines.forEach((line) => {
        const firstCoord = line.coords[0];
        const firstSymbol = matrix[firstCoord[0]][firstCoord[1]];
        let matchCount = 1;
        let mainSymbol = firstSymbol;

        for (let i = 1; i < line.coords.length; i++) {
          const coord = line.coords[i];
          const currentSymbol = matrix[coord[0]][coord[1]];

          if (mainSymbol.char === '👑' && currentSymbol.char !== '👑') {
            mainSymbol = currentSymbol;
          }

          if (currentSymbol.char === mainSymbol.char || currentSymbol.char === '👑') {
            matchCount++;
          } else {
            break;
          }
        }

        if (matchCount >= 3) {
          const winAmount = (bet / 3) * (mainSymbol.pay * (matchCount - 2));
          totalWin += winAmount;

          // Destaca as células vencedoras da linha
          for (let i = 0; i < matchCount; i++) {
            const [c, r] = line.coords[i];
            const strip = document.getElementById(`strip${c}`);
            const cell = strip.querySelectorAll('.slot-cell')[r];
            cell.classList.add('win-highlight');
          }

          winMessages.push(`${line.name}`);
        }
      });

      if (totalWin > 0) {
        balance += totalWin;
        document.getElementById('message').textContent = `GANHOU R$ ${totalWin.toFixed(2)}! [${winMessages.join(' | ')}]`;
      } else {
        document.getElementById('message').textContent = "Sem combinações nas 3 linhas. Tente de novo!";
      }

      updateDisplay();
    }

    initReels();
    updateDisplay();
  </script>
</body>
</html>

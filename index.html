<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K9K Slots Premium - 5 Linhas de Aposta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #2e1605 0%, #120a03 50%, #050201 100%);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container Principal */
    .machine-wrapper {
      position: relative;
      width: 95%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Cabeçalho com Logo e Jackpots */
    .top-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .logo-box {
      text-align: center;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 10px #ff9900, 0 0 20px #ff5500;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 1px;
    }

    .logo-box span {
      display: block;
      font-size: 10px;
      color: #fff;
      letter-spacing: 4px;
      margin-top: 2px;
    }

    .jackpot-header {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex-grow: 1;
    }

    .jackpot-card {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 6px;
      padding: 5px 2px;
      text-align: center;
      box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.1);
      border: 1px solid #d4af37;
    }

    .jackpot-card.grand { border-color: #ff3333; box-shadow: 0 0 8px rgba(255, 51, 51, 0.4); }
    .jackpot-card.major { border-color: #a833ff; box-shadow: 0 0 8px rgba(168, 51, 255, 0.4); }
    .jackpot-card.minor { border-color: #3385ff; box-shadow: 0 0 8px rgba(51, 133, 255, 0.4); }
    .jackpot-card.mini  { border-color: #33ff77; box-shadow: 0 0 8px rgba(51, 255, 119, 0.4); }

    .jackpot-title {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .jackpot-value {
      font-size: 10px;
      font-weight: bold;
      color: #fff;
    }

    /* Moldura Dourada da Caça-Níqueis */
    .gold-frame {
      width: 100%;
      background: linear-gradient(145deg, #ffe066, #d4af37 30%, #8a6d1c 70%, #ffd700);
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(255, 170, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.6);
      position: relative;
    }

    .inner-screen {
      background: #000;
      border-radius: 12px;
      padding: 10px;
      border: 3px solid #1a1a1a;
      box-shadow: inset 0 0 30px rgba(0,0,0,1);
      position: relative;
    }

    /* Indicador de Linhas de Aposta Fixas (5 LINHAS) */
    .line-tag {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(180deg, #d4af37, #8a6d1c);
      color: #000;
      font-size: 10px;
      font-weight: bold;
      padding: 10px 4px;
      border-radius: 4px;
      text-align: center;
      line-height: 1.1;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
      z-index: 10;
    }
    .line-tag.left { left: -14px; border-radius: 6px 0 0 6px; }
    .line-tag.right { right: -14px; border-radius: 0 6px 6px 0; }

    /* Matriz 3x3 */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .reel-window {
      height: 280px; /* 3 Células visíveis */
      background: radial-gradient(circle, #1a1a24 0%, #08080c 100%);
      border-radius: 8px;
      border: 1px solid #333;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
    }

    .reel-strip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px;
      will-change: transform;
    }

    .slot-cell {
      height: 84px;
      min-height: 84px;
      background: radial-gradient(circle, #252538 0%, #12121c 100%);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 46px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 2px 4px rgba(0,0,0,0.5);
      user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .slot-cell.win-highlight {
      animation: pulseWin 0.5s infinite alternate;
      border: 2px solid #ffe066;
      background: radial-gradient(circle, #664d00 0%, #261d00 100%);
    }

    @keyframes pulseWin {
      0% { transform: scale(0.96); box-shadow: 0 0 12px #ffcc00; }
      100% { transform: scale(1.04); box-shadow: 0 0 25px #ffcc00; }
    }

    /* Mensagem de Resultado */
    .message-bar {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #ffcc00;
      min-height: 20px;
      text-shadow: 0 0 5px rgba(255, 204, 0, 0.5);
    }

    /* Painel Inferior de Controles */
    .control-panel {
      width: 100%;
      margin-top: 15px;
      background: linear-gradient(180deg, #181824 0%, #0a0a0f 100%);
      border: 2px solid #d4af37;
      border-radius: 40px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }

    .panel-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-card {
      background: #0d0d14;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 6px 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 9px;
      color: #aaaaaa;
      text-transform: uppercase;
      font-weight: bold;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 900;
      color: #fff;
    }

    /* Botões de Aposta (- / +) */
    .btn-circle {
      background: linear-gradient(180deg, #3a3a50, #1f1f2e);
      color: #fff;
      border: 1px solid #555;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 3px 0 #111;
    }

    .btn-circle:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111;
    }

    /* Botão Principal Verde Neon */
    .btn-spin-glow {
      background: radial-gradient(circle, #55ff55 0%, #009900 70%, #004d00 100%);
      border: 3px solid #aaffaa;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.8);
      transition: transform 0.1s, box-shadow 0.1s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .btn-spin-glow:active {
      transform: scale(0.92);
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
    }

    .btn-spin-glow:disabled {
      background: #333;
      border-color: #555;
      box-shadow: none;
      color: #777;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="machine-wrapper">
    
    <!-- Topo: Logo & Jackpots -->
    <div class="top-header">
      <div class="logo-box">
        🐯 FORTUNE
        <span>SLOTS</span>
      </div>
      <div class="jackpot-header">
        <div class="jackpot-card grand">
          <div class="jackpot-title" style="color: #ff3333;">Grand</div>
          <div class="jackpot-value">R$ 50.000</div>
        </div>
        <div class="jackpot-card major">
          <div class="jackpot-title" style="color: #a833ff;">Major</div>
          <div class="jackpot-value">R$ 10.000</div>
        </div>
        <div class="jackpot-card minor">
          <div class="jackpot-title" style="color: #3385ff;">Minor</div>
          <div class="jackpot-value">R$ 2.000</div>
        </div>
        <div class="jackpot-card mini">
          <div class="jackpot-title" style="color: #33ff77;">Mini</div>
          <div class="jackpot-value">R$ 500</div>
        </div>
      </div>
    </div>

    <!-- Moldura Dourada Principal -->
    <div class="gold-frame">
      <div class="line-tag left">LINHAS<br><b>5</b></div>
      <div class="line-tag right">LINHAS<br><b>5</b></div>

      <div class="inner-screen">
        <!-- Matriz 3x3 -->
        <div class="reels-grid">
          <div class="reel-window"><div class="reel-strip" id="strip0"></div></div>
          <div class="reel-window"><div class="reel-strip" id="strip1"></div></div>
          <div class="reel-window"><div class="reel-strip" id="strip2"></div></div>
        </div>

        <!-- Mensagem -->
        <div class="message-bar" id="message">Pressione GIRAR para jogar!</div>
      </div>
    </div>

    <!-- Painel de Controle (Rodapé) -->
    <div class="control-panel">
      <!-- Saldo -->
      <div class="stat-card">
        <div class="stat-label">Saldo</div>
        <div class="stat-value" id="balanceDisplay">R$ 1.250,00</div>
      </div>

      <!-- Controles de Aposta -->
      <div class="panel-group">
        <button class="btn-circle" onclick="changeBet(-1)">-</button>
        <div class="stat-card">
          <div class="stat-label">Aposta</div>
          <div class="stat-value" id="betDisplay">R$ 5,00</div>
        </div>
        <button class="btn-circle" onclick="changeBet(1)">+</button>
      </div>

      <!-- Botão Spin Verde Neon -->
      <button class="btn-spin-glow" id="spinBtn" onclick="spin()">↻</button>
    </div>

  </div>

  <script>
    // Tabela de Pagamentos atualizada com base na imagem do jogo (Tigre da Sorte)
    const SYMBOLS = [
      { char: '🍊', name: 'Laranja', pay: 3 },
      { char: '🧨', name: 'Dinamite', pay: 5 },
      { char: '🧧', name: 'Envelope Red', pay: 8 },
      { char: '💰', name: 'Saco de Moedas', pay: 10 },
      { char: '🐉', name: 'Aulete/Talismã', pay: 25 },
      { char: '🪙', name: 'Lingote de Ouro', pay: 100 },
      { char: '🐯', name: 'WILD (Tigre)', pay: 250 }
    ];

    let balance = 1250.00;
    let bet = 5.00;
    const betSteps = [1, 2, 5, 10, 20, 50];
    let betIndex = 2;
    let isSpinning = false;

    /* 
      ======================================================
      CONFIGURAÇÃO DAS 5 LINHAS DE GANHO FIXAS (3x3):
      ======================================================
      1ª Linha: Horizontal do Meio ➡️ (Linha 1)
      2ª Linha: Horizontal de Cima ➡️ (Linha 0)
      3ª Linha: Horizontal de Baixo ➡️ (Linha 2)
      4ª Linha: Diagonal Descendente ↘️
      5ª Linha: Diagonal Ascendente ↗️
    */
    const paylines = [
      { id: 1, name: "1ª Linha ➡️ (Meio)", coords: [[0,1], [1,1], [2,1]] },
      { id: 2, name: "2ª Linha ➡️ (Acima)", coords: [[0,0], [1,0], [2,0]] },
      { id: 3, name: "3ª Linha ➡️ (Abaixo)", coords: [[0,2], [1,2], [2,2]] },
      { id: 4, name: "4ª Linha ↘️ (Diagonal)", coords: [[0,0], [1,1], [2,2]] },
      { id: 5, name: "5ª Linha ↗️ (Diagonal)", coords: [[0,2], [1,1], [2,0]] }
    ];

    function getRandomSymbol() {
      return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    }

    function initReels() {
      for (let col = 0; col < 3; col++) {
        const strip = document.getElementById(`strip${col}`);
        strip.innerHTML = '';
        for (let i = 0; i < 25; i++) {
          const cell = document.createElement('div');
          cell.className = 'slot-cell';
          cell.textContent = getRandomSymbol().char;
          strip.appendChild(cell);
        }
        strip.style.transform = 'translateY(0px)';
      }
    }

    function updateDisplay() {
      document.getElementById('balanceDisplay').textContent = `R$ ${balance.toFixed(2)}`;
      document.getElementById('betDisplay').textContent = `R$ ${bet.toFixed(2)}`;
    }

    function changeBet(direction) {
      if (isSpinning) return;
      betIndex += direction;
      if (betIndex < 0) betIndex = 0;
      if (betIndex >= betSteps.length) betIndex = betSteps.length - 1;
      bet = betSteps[betIndex];
      updateDisplay();
    }

    function clearHighlights() {
      document.querySelectorAll('.slot-cell').forEach(cell => {
        cell.classList.remove('win-highlight');
      });
    }

    function spin() {
      if (isSpinning) return;
      if (balance < bet) {
        document.getElementById('message').textContent = "Saldo insuficiente!";
        return;
      }

      clearHighlights();
      balance -= bet;
      updateDisplay();
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('message').textContent = "Girando...";

      const finalMatrix = [[], [], []];
      let finishedCols = 0;

      for (let col = 0; col < 3; col++) {
        const strip = document.getElementById(`strip${col}`);
        
        const res0 = getRandomSymbol();
        const res1 = getRandomSymbol();
        const res2 = getRandomSymbol();
        finalMatrix[col] = [res0, res1, res2];

        const cells = strip.querySelectorAll('.slot-cell');
        cells[0].textContent = res0.char;
        cells[1].textContent = res1.char;
        cells[2].textContent = res2.char;

        for (let k = 3; k < cells.length; k++) {
          cells[k].textContent = getRandomSymbol().char;
        }

        strip.style.transition = 'none';
        strip.style.transform = `translateY(-1980px)`;

        strip.offsetHeight; // Força renderização

        const duration = 2.0 + (col * 0.35);
        strip.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.85, 0.25, 1)`;
        strip.style.transform = 'translateY(0px)';

        setTimeout(() => {
          finishedCols++;
          if (finishedCols === 3) {
            checkWinnings(finalMatrix);
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
          }
        }, duration * 1000);
      }
    }

    function checkWinnings(matrix) {
      let totalWin = 0;
      let winningLinesCount = 0;
      let winningCellsSet = new Set();

      paylines.forEach((line) => {
        const [c0, r0] = line.coords[0];
        const [c1, r1] = line.coords[1];
        const [c2, r2] = line.coords[2];

        const s0 = matrix[c0][r0];
        const s1 = matrix[c1][r1];
        const s2 = matrix[c2][r2];

        // Regra do Wild
        let mainSymbol = s0;
        if (mainSymbol.char === '🐯') mainSymbol = s1;
        if (mainSymbol.char === '🐯') mainSymbol = s2;

        const isMatch1 = (s0.char === mainSymbol.char || s0.char === '🐯');
        const isMatch2 = (s1.char === mainSymbol.char || s1.char === '🐯');
        const isMatch3 = (s2.char === mainSymbol.char || s2.char === '🐯');

        if (isMatch1 && isMatch2 && isMatch3) {
          const lineWin = bet * mainSymbol.pay;
          totalWin += lineWin;
          winningLinesCount++;

          line.coords.forEach(([c, r]) => {
            winningCellsSet.add(`${c},${r}`);
            const strip = document.getElementById(`strip${c}`);
            const cell = strip.querySelectorAll('.slot-cell')[r];
            cell.classList.add('win-highlight');
          });
        }
      });

      // Regra de Multiplicador x10: Quando TODOS os 9 espaços da tela estiverem em ganhos
      let isFullBoardWin = (winningCellsSet.size === 9);
      if (isFullBoardWin) {
        totalWin = totalWin * 10;
      }

      if (totalWin > 0) {
        balance += totalWin;
        if (isFullBoardWin) {
          document.getElementById('message').textContent = `🔥 TELA CHEIA! MULTIPLICADOR x10! GANHOU R$ ${totalWin.toFixed(2)}! 🔥`;
        } else {
          document.getElementById('message').textContent = `GANHOU R$ ${totalWin.toFixed(2)}! (${winningLinesCount} linha(s) premiada(s))`;
        }
      } else {
        document.getElementById('message').textContent = "Sem combinações. Tente novamente!";
      }

      updateDisplay();
    }

    initReels();
    updateDisplay();
  </script>
</body>
</html>

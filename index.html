<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Slots 3x3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0a0f linear-gradient(135deg, #0d0d1a 0%, #050508 100%);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .slot-container {
      background: #14141f;
      border: 3px solid #d4af37;
      border-radius: 20px;
      padding: 25px;
      width: 95%;
      max-width: 450px;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
      text-align: center;
    }

    /* Grelha 3x3 com Rolagem Vertical */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background: #000;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #333;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
      margin-bottom: 20px;
    }

    .reel-window {
      height: 280px; /* Exibe exatamente 3 células */
      background: #11111a;
      border-radius: 8px;
      border: 1px solid #222;
      overflow: hidden;
      position: relative;
    }

    .reel-strip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 5px;
      will-change: transform;
    }

    .slot-cell {
      height: 80px;
      min-height: 80px;
      background: radial-gradient(circle, #222233 0%, #11111a 100%);
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      user-select: none;
    }

    .slot-cell.win-highlight {
      animation: pulseWin 0.6s infinite alternate;
      border: 2px solid #ffcc00;
      background: radial-gradient(circle, #443311 0%, #221100 100%);
    }

    @keyframes pulseWin {
      0% { transform: scale(0.95); box-shadow: 0 0 10px #ffcc00; }
      100% { transform: scale(1.05); box-shadow: 0 0 25px #ffcc00; }
    }

    /* Painel de Controle */
    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0a12;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid #2a2a3a;
      gap: 15px;
    }

    .stat-box {
      text-align: left;
    }

    .stat-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }

    .bet-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-bet {
      background: #222233;
      color: #fff;
      border: 1px solid #444;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    .btn-spin {
      background: linear-gradient(180deg, #ffcc00 0%, #cc9900 100%);
      color: #000;
      border: none;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
      transition: transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-spin:active {
      transform: scale(0.92);
    }

    .btn-spin:disabled {
      background: #444;
      color: #888;
      box-shadow: none;
      cursor: not-allowed;
    }

    .message-bar {
      margin-bottom: 15px;
      font-size: 15px;
      font-weight: bold;
      color: #ffcc00;
      min-height: 22px;
    }
  </style>
</head>
<body>

  <div class="slot-container">
    <div class="message-bar" id="message">Clique no botão para girar!</div>

    <!-- Matriz 3x3 -->
    <div class="reels-grid">
      <div class="reel-window"><div class="reel-strip" id="strip0"></div></div>
      <div class="reel-window"><div class="reel-strip" id="strip1"></div></div>
      <div class="reel-window"><div class="reel-strip" id="strip2"></div></div>
    </div>

    <!-- Painel -->
    <div class="control-panel">
      <div class="stat-box">
        <div class="stat-label">Saldo</div>
        <div class="stat-value" id="balanceDisplay">R$ 100,00</div>
      </div>

      <div class="bet-controls">
        <button class="btn-bet" onclick="changeBet(-1)">-</button>
        <div class="stat-box" style="text-align: center;">
          <div class="stat-label">Aposta</div>
          <div class="stat-value" id="betDisplay">R$ 5,00</div>
        </div>
        <button class="btn-bet" onclick="changeBet(1)">+</button>
      </div>

      <button class="btn-spin" id="spinBtn" onclick="spin()">↻</button>
    </div>
  </div>

  <script>
    const SYMBOLS = [
      { char: '🍋', name: 'Limão', pay: 2 },
      { char: '🍊', name: 'Laranja', pay: 2 },
      { char: '🍒', name: 'Cereja', pay: 3 },
      { char: '🍇', name: 'Uva', pay: 3 },
      { char: '🍉', name: 'Melancia', pay: 4 },
      { char: '🧧', name: 'Envelope Vermelho', pay: 5 },
      { char: '🧨', name: 'Dinamite', pay: 8 },
      { char: '🔔', name: 'Sino', pay: 10 },
      { char: '💎', name: 'Diamante', pay: 15 },
      { char: '👑', name: 'WILD', pay: 25 }
    ];

    let balance = 100.00;
    let bet = 5.00;
    const betSteps = [1, 2, 5, 10, 20, 50];
    let betIndex = 2;
    let isSpinning = false;

    // 3 Linhas de combinação para o quadro 3x3
    const paylines = [
      { name: "Linha do Meio ➡️", coords: [[0,1], [1,1], [2,1]] },
      { name: "Diagonal Descendente ↘️", coords: [[0,0], [1,1], [2,2]] },
      { name: "Diagonal Ascendente ↗️", coords: [[0,2], [1,1], [2,0]] }
    ];

    function getRandomSymbol() {
      return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    }

    function initReels() {
      for (let col = 0; col < 3; col++) {
        const strip = document.getElementById(`strip${col}`);
        strip.innerHTML = '';
        for (let i = 0; i < 25; i++) {
          const cell = document.createElement('div');
          cell.className = 'slot-cell';
          cell.textContent = getRandomSymbol().char;
          strip.appendChild(cell);
        }
        strip.style.transform = 'translateY(0px)';
      }
    }

    function updateDisplay() {
      document.getElementById('balanceDisplay').textContent = `R$ ${balance.toFixed(2)}`;
      document.getElementById('betDisplay').textContent = `R$ ${bet.toFixed(2)}`;
    }

    function changeBet(direction) {
      if (isSpinning) return;
      betIndex += direction;
      if (betIndex < 0) betIndex = 0;
      if (betIndex >= betSteps.length) betIndex = betSteps.length - 1;
      bet = betSteps[betIndex];
      updateDisplay();
    }

    function clearHighlights() {
      document.querySelectorAll('.slot-cell').forEach(cell => {
        cell.classList.remove('win-highlight');
      });
    }

    function spin() {
      if (isSpinning) return;
      if (balance < bet) {
        document.getElementById('message').textContent = "Saldo insuficiente!";
        return;
      }

      clearHighlights();
      balance -= bet;
      updateDisplay();
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('message').textContent = "Girando...";

      const finalMatrix = [[], [], []];
      let finishedCols = 0;

      for (let col = 0; col < 3; col++) {
        const strip = document.getElementById(`strip${col}`);
        
        const res0 = getRandomSymbol();
        const res1 = getRandomSymbol();
        const res2 = getRandomSymbol();
        finalMatrix[col] = [res0, res1, res2];

        const cells = strip.querySelectorAll('.slot-cell');
        cells[0].textContent = res0.char;
        cells[1].textContent = res1.char;
        cells[2].textContent = res2.char;

        for (let k = 3; k < cells.length; k++) {
          cells[k].textContent = getRandomSymbol().char;
        }

        strip.style.transition = 'none';
        strip.style.transform = `translateY(-1980px)`; // Inicia no fundo da fita

        strip.offsetHeight; // Força reflow

        // Duração de ~2.0 segundos para a rolagem longa
        const duration = 2.0 + (col * 0.3);
        strip.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.85, 0.25, 1)`;
        strip.style.transform = 'translateY(0px)';

        setTimeout(() => {
          finishedCols++;
          if (finishedCols === 3) {
            checkWinnings(finalMatrix);
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
          }
        }, duration * 1000);
      }
    }

    function checkWinnings(matrix) {
      let totalWin = 0;
      let winMessages = [];

      paylines.forEach((line) => {
        const [c0, r0] = line.coords[0];
        const [c1, r1] = line.coords[1];
        const [c2, r2] = line.coords[2];

        const s0 = matrix[c0][r0];
        const s1 = matrix[c1][r1];
        const s2 = matrix[c2][r2];

        let mainSymbol = s0;
        if (mainSymbol.char === '👑') mainSymbol = s1;
        if (mainSymbol.char === '👑') mainSymbol = s2;

        const isMatch1 = (s0.char === mainSymbol.char || s0.char === '👑');
        const isMatch2 = (s1.char === mainSymbol.char || s1.char === '👑');
        const isMatch3 = (s2.char === mainSymbol.char || s2.char === '👑');

        if (isMatch1 && isMatch2 && isMatch3) {
          const winAmount = bet * mainSymbol.pay;
          totalWin += winAmount;

          line.coords.forEach(([c, r]) => {
            const strip = document.getElementById(`strip${c}`);
            const cell = strip.querySelectorAll('.slot-cell')[r];
            cell.classList.add('win-highlight');
          });

          winMessages.push(line.name);
        }
      });

      if (totalWin > 0) {
        balance += totalWin;
        document.getElementById('message').textContent = `GANHOU R$ ${totalWin.toFixed(2)}! [${winMessages.join(' | ')}]`;
      } else {
        document.getElementById('message').textContent = "Sem combinações desta vez. Tente novamente!";
      }

      updateDisplay();
    }

    initReels();
    updateDisplay();
  </script>
</body>
</html>
